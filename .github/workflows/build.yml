name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: leave-widget
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1 -y --cleanup-tag || true
          gh release create v1 leave-widget/app/build/outputs/apk/debug/app-debug.apk --title "Leave Tracker" --notes "Install this APK"
